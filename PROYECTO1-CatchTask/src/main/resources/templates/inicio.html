<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>

    <!-- Conecta esta página con el archivo CSS para aplicar el diseño -->
    <link rel="stylesheet" href="/css/estilo.css">
</head>
	
<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>Bienvenido a CatchTask</h1>
			
			<a th:href="@{/asignaturas}">Mis asignaturas</a>

            <p>Has iniciado sesión correctamente.</p>

            <!-- Enlace para cerrar la sesión del usuario -->
            <a href="/logout">Cerrar sesión</a>

        </div>

    </div>
	
	<!-- Comprueba si el navegador recupera una página guardada y la recarga para verificar la sesión del usuario -->
	<script>
		window.addEventListener("pageshow", function(event) {
			if (event.persisted) {
				window.location.reload();
			}
		});
	</script>
</body>
</html>
