<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>

    <!-- Conecta esta página con el archivo CSS para aplicar el diseño -->
    <link rel="stylesheet" href="/css/estilo.css">
</head>
	
<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>Bienvenido a CatchTask</h1>
			
			<!-- Agrupa los enlaces principales para poder separarlos. -->
			<div class="enlaces-principales">	
				<!-- Enlace para consultar las asignaturas del usuario. -->
				<a th:href="@{/asignaturas}">Mis asignaturas</a>	
				<!-- Enlace para consultar y gestionar las tareas del usuario. -->
				<a th:href="@{/tareas}">Mis tareas</a>
			</div>
			
		</div>
		
		<!-- Enlace para cerrar sesión, situado debajo de los anteriores. -->
		<div class="cerrar-sesion">
		    <a th:href="@{/logout}">Cerrar sesión</a>
		</div>

    </div>
	
	<!-- Comprueba si el navegador recupera una página guardada y la recarga para verificar la sesión del usuario -->
	<script>
		window.addEventListener("pageshow", function(event) {
			if (event.persisted) {
				window.location.reload();
			}
		});
	</script>
	
</body>
</html>
