<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis asignaturas | CatchTask</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
	
	<div class="contenedor-asignaturas">

    		<h1>Mis asignaturas</h1>
	
		<!-- Añadido enlace de cerrar sesión a la pantalla de mis asignaturas -->
		<a class="cerrar-sesion" th:href="@{/logout}">Cerrar sesión</a>

    		<p class="descripcion-pagina">Organiza y consulta tus asignaturas.</p>

    		<p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
    		<p class="error" th:if="${error}" th:text="${error}"></p>

    		<a class="boton-anadir" th:href="@{/asignaturas/nueva}">+ Añadir asignatura</a>

    		<p th:if="${#lists.isEmpty(asignaturas)}">
        		Aún no tienes asignaturas registradas.
    		</p>
			
			<div class="lista-asignaturas">
			
				<div class="tarjeta-asignatura" th:each="asignatura : ${asignaturas}">
        
			<h2 th:text="${asignatura.nombre}"></h2>

        <p>
            <strong>Descripción:</strong>
            <span th:text="${asignatura.descripcion}"></span>
        </p>

        <p>
            <strong>Curso:</strong>
            <span th:text="${asignatura.curso}"></span>
        </p>

        <p>
            <strong>Profesor:</strong>
            <span th:text="${asignatura.profesor}"></span>
        </p>
		
		<div class="acciones-asignatura">

        		<a class="boton-editar" th:href="@{/asignaturas/editar/{id}(id=${asignatura.id})}">
            		Editar
        		</a>

        <form th:action="@{/asignaturas/eliminar/{id}(id=${asignatura.id})}"
              method="post"
              onsubmit="return confirm('¿Seguro que quieres eliminar esta asignatura?');">

            <button type="submit">Eliminar</button>

        </form>
	</div> <!-- Cierra las acciones -->

  </div> <!-- Cierra la tarjeta -->

 </div> <!-- Cierra la lista de asignaturas -->

 <a class="volver-inicio" th:href="@{/inicio}">Volver al inicio</a>
	
</div> <!-- Cierra el contenedor principal -->

	<!-- Comprueba si el navegador recupera una página guardada y la recarga para verificar la sesión del usuario -->
		<script>
			window.addEventListener("pageshow", function(event) {
				if (event.persisted) {
					window.location.reload();
				}
			});
		</script>
</body>
</html>
